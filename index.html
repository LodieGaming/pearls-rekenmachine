<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pearls Rekenmachine</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f2a44,#1f4d7a);
padding:24px;
}

.page{
max-width:900px;
margin:auto;
}

.container{
background:white;
padding:28px;
border-radius:18px;
box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

.logo{
text-align:center;
margin-bottom:10px;
}

.logo img{
width:220px;
}

h1{
text-align:center;
color:#c9a33c;
margin:0 0 6px 0;
}

.subtitle{
text-align:center;
color:#6b7280;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0f2a44;
color:white;
padding:12px;
text-align:left;
}

td{
padding:10px;
border-bottom:1px solid #eee;
}

.product-name{
font-weight:600;
color:#0f2a44;
}

input{
width:90px;
padding:8px;
text-align:center;
border-radius:8px;
border:1px solid #ccc;
}

input:focus{
border-color:#c9a33c;
outline:none;
}

.results{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:20px;
}

.card{
background:#f8fafc;
border-left:5px solid #c9a33c;
padding:16px;
border-radius:10px;
}

.card-label{
font-size:14px;
color:#666;
}

.card-value{
font-size:24px;
font-weight:700;
color:#0f2a44;
}

.actions{
text-align:center;
margin-top:20px;
}

button{
padding:12px 24px;
border:none;
background:#c9a33c;
color:white;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

button:hover{
background:#b68f2b;
}

</style>
</head>

<body>

<div class="page">
<div class="container">

<div class="logo">
<img src="pearls_logo.png" alt="Pearls logo">
</div>

<h1>Pearls Rekenmachine</h1>
<div class="subtitle">Uitbetaling berekenen voor Kassa en NPC bezorgingen</div>

<table>

<tr>
<th>Product</th>
<th>Aantal</th>
</tr>

<tbody id="tableRows"></tbody>

</table>

<div class="results">

<div class="card">
<div class="card-label">Totaal producten</div>
<div class="card-value" id="totalProducts">0</div>
</div>

<div class="card">
<div class="card-label">Kassa</div>
<div class="card-value" id="kassaTotal">€0</div>
</div>

<div class="card">
<div class="card-label">Bezorgingen</div>
<div class="card-value" id="deliveryTotal">€0</div>
</div>

<div class="card">
<div class="card-label">Totale omzet</div>
<div class="card-value" id="revenue">€0</div>
</div>

</div>

<div class="actions">
<button onclick="resetValues()">Reset</button>
</div>

</div>
</div>

<script>

const deliveryPrice = 450;
const kassaCommission = 0.10;

const products = [
"Haring",
"Kibbeling",
"Lekkerbek",
"Oesters",
"Visfrietjes",
"Patat",
"Fish Taco",
"Fish Burger",
"Sushi Nigiri",
"Sushi Kappa Maki",
"Sushi Ura Maki",
"Milkshake Aardbei",
"Milkshake Banaan",
"Milkshake Chocolade",
"Lime Splash",
"Scarlet Devil",
"The Shirley Spark",
"Bananasplit",
"Pearls Breeze"
];

const kassaPrices = [
35,
95,
35,
180,
45,
45,
110,
95,
50,
50,
50,
140,
140,
140,
95,
120,
150,
175,
135
];

function euro(x){
return "€" + x.toLocaleString('nl-NL',{minimumFractionDigits:2, maximumFractionDigits:2})
}

function calculate(){

let totalProducts = 0
let totalKassa = 0

products.forEach((_,i)=>{

let input = document.getElementById("p"+i)
let value = Number(input.value) || 0

localStorage.setItem("pearls_product_"+i,value)

totalProducts += value
totalKassa += value * (kassaPrices[i] * kassaCommission)

})

let totalBezorgingen = totalProducts * deliveryPrice
let totalRevenue = totalBezorgingen + totalKassa

document.getElementById("totalProducts").innerText = totalProducts
document.getElementById("kassaTotal").innerText = euro(totalKassa)
document.getElementById("deliveryTotal").innerText = euro(totalBezorgingen)
document.getElementById("revenue").innerText = euro(totalRevenue)

}

function resetValues(){

products.forEach((_,i)=>{
document.getElementById("p"+i).value=""
localStorage.removeItem("pearls_product_"+i)
})

calculate()

}

function buildTable(){

let table = document.getElementById("tableRows")

products.forEach((name,i)=>{

let tr = document.createElement("tr")

let tdName = document.createElement("td")
tdName.className = "product-name"
tdName.innerText = name

let tdInput = document.createElement("td")

let input = document.createElement("input")
input.type="number"
input.min="0"
input.id="p"+i
input.oninput=calculate

let saved = localStorage.getItem("pearls_product_"+i)
if(saved){
input.value = saved
}

tdInput.appendChild(input)

tr.appendChild(tdName)
tr.appendChild(tdInput)

table.appendChild(tr)

})

}

buildTable()
calculate()

</script>

</body>
</html>
