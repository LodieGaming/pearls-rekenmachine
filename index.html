<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Pearls Rekenmachine</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#0f2a44,#1f4d7a);
margin:0;
padding:40px;
display:flex;
justify-content:center;
}

.container{
background:white;
padding:30px;
border-radius:14px;
width:720px;
box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

.logo{
text-align:center;
margin-bottom:15px;
}

.logo img{
width:230px;
}

h1{
text-align:center;
color:#c9a33c;
margin-bottom:5px;
margin-top:0;
font-weight:600;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:25px;
}

table{
width:100%;
border-collapse:collapse;
margin-bottom:20px;
}

th{
background:#0f2a44;
color:white;
padding:12px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
}

input{
width:90px;
padding:7px;
text-align:center;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

input:focus{
border-color:#c9a33c;
outline:none;
box-shadow:0 0 4px rgba(201,163,60,0.5);
}

.results{
background:#f8f8f8;
padding:18px;
border-radius:10px;
font-size:18px;
margin-top:10px;
border-left:5px solid #c9a33c;
}

.result-row{
display:flex;
justify-content:space-between;
margin:6px 0;
}

button{
margin-top:18px;
padding:11px 20px;
border:none;
background:#c9a33c;
color:white;
border-radius:8px;
font-size:16px;
cursor:pointer;
font-weight:600;
}

button:hover{
background:#b28f30;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
<img src="pearls_logo.png">
</div>

<h1>Pearls Rekenmachine</h1>
<div class="subtitle">Productprijs €450</div>

<table>

<tr>
<th>Product</th>
<th>Aantal</th>
</tr>

<tbody id="tableRows"></tbody>

</table>

<div class="results">

<div class="result-row">
<span>Totaal producten</span>
<span id="totalProducts">0</span>
</div>

<div class="result-row">
<span>Totale omzet</span>
<span id="revenue">€0</span>
</div>

<div class="result-row">
<span>30% commissie</span>
<span id="commission30">€0</span>
</div>

<div class="result-row">
<span>40% commissie</span>
<span id="commission40">€0</span>
</div>

</div>

<button onclick="resetValues()">Reset</button>

</div>

<script>

const price = 450
const maxProducts = 19

function euro(x){
return "€" + x.toLocaleString('nl-NL',{minimumFractionDigits:2})
}

function calculate(){

let total = 0

for(let i=1;i<=maxProducts;i++){

let val = Number(document.getElementById("p"+i).value) || 0

localStorage.setItem("p"+i,val)

total += val
}

let revenue = total * price
let c30 = revenue * 0.30
let c40 = revenue * 0.40

document.getElementById("totalProducts").innerText = total
document.getElementById("revenue").innerText = euro(revenue)
document.getElementById("commission30").innerText = euro(c30)
document.getElementById("commission40").innerText = euro(c40)

}

function resetValues(){

for(let i=1;i<=maxProducts;i++){
document.getElementById("p"+i).value=""
localStorage.removeItem("p"+i)
}

calculate()

}

const table = document.getElementById("tableRows")

for(let i=1;i<=maxProducts;i++){

let tr = document.createElement("tr")

let td1 = document.createElement("td")
td1.innerText = "Product " + i

let td2 = document.createElement("td")

let input = document.createElement("input")
input.type="number"
input.id="p"+i
input.oninput=calculate

let saved = localStorage.getItem("p"+i)

if(saved){
input.value = saved
}

td2.appendChild(input)

tr.appendChild(td1)
tr.appendChild(td2)

table.appendChild(tr)

}

calculate()

</script>

</body>
</html>
